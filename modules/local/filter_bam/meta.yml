# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "filter_bam"
description: Filter BAM files by excluding sequences in a provided list
keywords:
  - alignment
  - bam
  - filtering
tools:
  - "samtools":
      description: "Tools for manipulating next-generation sequencing data"
      homepage: "http://www.htslib.org/"
      tool_dev_url: "https://github.com/samtools/samtools"
      doi: "10.1093/gigascience/giab008"
      licence: ["MIT"]
      identifier: biotools:samtools

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - bam:
        type: file
        description: "BAM file to filter"
        pattern: "*.bam"
        ontologies:
          - edam: http://edamontology.org/format_2572 # BAM
    - filter_list:
        type: file
        description: "List of sequence names to exclude"
        pattern: "*.txt"

output:
  bam:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.filtered.bam":
          type: file
          description: Filtered BAM file
          pattern: "*.filtered.bam"
          ontologies:
            - edam: http://edamontology.org/format_2572 # BAM

  versions:
    - - ${task.process}:
          type: string
      - samtools:
          type: string
      - 'samtools version | sed "1!d;s/.* //"':
          type: string

topics:
  versions:
    - - ${task.process}:
          type: string
      - samtools:
          type: string

authors:
  - "@prototaxites"
maintainers:
  - "@prototaxites"
