# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "create_contig2bin"
description: Create contig-to-bin mapping from bin FASTA files
keywords:
  - metagenomics
  - binning
  - mapping
tools:
  - "create_contig2bin.py":
      description: "Python script to create contig-to-bin mapping"
      homepage: "https://github.com/wwood/CoverM"
      licence: ["GPL v3"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - bins:
        type: directory
        description: "Directory containing bin FASTA files"

output:
  contig2bin:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.contig2bin":
          type: file
          description: Tab-delimited file mapping contig IDs to bin IDs
          pattern: "*.contig2bin"

  versions:
    - - ${task.process}:
          type: string
      - create_contig2bin.py:
          type: string
      - 'create_contig2bin.py --version':
          type: string

topics:
  versions:
    - - ${task.process}:
          type: string
      - create_contig2bin.py:
          type: string

authors:
  - "@prototaxites"
maintainers:
  - "@prototaxites"
