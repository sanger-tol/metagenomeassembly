# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "contig2bintofasta"
description: Extract bin sequences from contigs using contig-to-bin mapping
keywords:
  - metagenomics
  - binning
  - sequence extraction
tools:
  - "seqkit":
      description: "A cross-platform and ultrafast toolkit for FASTA/Q file manipulation"
      homepage: "https://bioinf.shenwei.me/seqkit/"
      tool_dev_url: "https://github.com/shenwei356/seqkit"
      licence: ["MIT"]
      identifier: biotools:seqkit

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - contigs:
        type: file
        description: "FASTA file containing assembled contigs"
        pattern: "*.{fasta,fa,fasta.gz,fa.gz}"
    - contig2bin:
        type: file
        description: "Tab-delimited file mapping contigs to bins"
        pattern: "*.contig2bin"

output:
  bins:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.fa.gz":
          type: file
          description: Gzipped FASTA files, one per bin
          pattern: "*.fa.gz"

  versions:
    - - ${task.process}:
          type: string
      - seqkit:
          type: string
      - 'seqkit version | sed "s/seqkit v//"':
          type: string

topics:
  versions:
    - - ${task.process}:
          type: string
      - seqkit:
          type: string

authors:
  - "@prototaxites"
maintainers:
  - "@prototaxites"
